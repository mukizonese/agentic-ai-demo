version: '3.8'

services:
  # ChromaDB for local vector storage
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb2
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
    networks:
      - agentic-network

  # MCP Server (Multi-Agent Orchestration)
  mcp-server:
    build:
      context: ../mcp-server
      dockerfile: Dockerfile
    container_name: mcp-server
    ports:
      - "8001:8001"
    env_file:
      - ./env/.env.docker_local
    depends_on:
      - chromadb
      - support-app-api
      - product-app-api
    networks:
      - agentic-network
    volumes:
      - ../mcp-server:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3



  # Product App API
  product-app-api:
    build:
      context: ../product-app-api
      dockerfile: Dockerfile
    container_name: product-app-api
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - ENVIRONMENT=development
    networks:
      - agentic-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Support App API
  support-app-api:
    build:
      context: ../support-app-api
      dockerfile: Dockerfile
    container_name: support-app-api
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - ENVIRONMENT=development
    networks:
      - agentic-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React App
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_MCP_SERVER_URL=http://localhost:8001
      - REACT_APP_ENVIRONMENT=development
    depends_on:
      - mcp-server
    networks:
      - agentic-network
    volumes:
      - ../frontend:/app
      - /app/node_modules

networks:
  agentic-network:
    driver: bridge

volumes:
  chromadb_data: 